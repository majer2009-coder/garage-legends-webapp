daily:function(){if(S.daily.d===today())return;S.daily.n=new Date(Date.now()-864e5).toDateString()===S.daily.d?S.daily.n+1:1;S.daily.d=today();var r=2000+500*(Math.min(S.daily.n,7)-1);gain(r);addXp(10);var x='';if(S.daily.n===7){addCar(mk('legendary',30));x=' + 🚗 Ночной Дрифтер!'}if(S.daily.n===30){addCar(mk('mythic',31));x=' + 🚗 Золотой Чемпион!'}ok();fanfare(2);if(x)conf('#ff7a1a');toast('🎁 +'+fmt(r)+' ₽ · серия '+S.daily.n+x);render()},
collect:function(){var p=pend();if(p<1)return;gain(p);S.col=Date.now();qadd('c');ok();snd(700,.15);toast('💰 +'+fmt(p)+' ₽');render()},
open:function(v){var a=v.split(':'),c=CT.concat([EV]).filter(function(x){return x.id===a[0]})[0],n=+a[1],p=cost(c,n);if(S.bal<p){toast('Недостаточно средств!');return}S.bal-=p;doOpen(c,n)},
gift:function(){if(!(S.gc>0))return;S.gc--;doOpen(CT[1],1)},
invite:function(){var l=BOT_LINK+'?startapp=ref_'+NET.id,u='https://t.me/share/url?url='+encodeURIComponent(l)+'&text='+encodeURIComponent('Заходи в Гараж Легенд — получи золотой кейс! 🏎️');try{tg.openTelegramLink(u)}catch(e){window.open(u)}},
notify:function(){var on=function(){api('/api/notify',{}).then(function(){toast('🔔 Уведомления включены')})};try{tg.requestWriteAccess(function(a){if(a)on();else toast('Доступ не выдан')})}catch(e){on()}},
duel:function(v){var c=find(v);if(!c)return;if(fuel()<1){toast('Нет топлива ⛽');return}api('/api/duel',{power:pw(c)}).then(function(r){if(r.error)throw 0;DUEL=r;try{A.go('d:'+v)}finally{DUEL=null}}).catch(function(){toast('Сервер недоступен')})},
free:function(){if(Date.now()-S.freeT<144e5)return;S.freeT=Date.now();doOpen(CT[0],1)},
dbl:function(v){var b=+v;if(S.bal<b){toast('Недостаточно средств!');return}S.bal-=b;if(Math.random()<.45){S.bal+=b*2;ok();conf('#22d3ee');fanfare(3);toast('🎲 Выигрыш +'+fmt(b)+' ₽')}else{snd(150,.4,'sawtooth');toast('🎲 Не повезло −'+fmt(b)+' ₽')}render()},
ach:function(v){var a=ACH.filter(function(x){return x[0]===v})[0];if(!a||S.ach[v]||!a[3]())return;S.ach[v]=1;gain(a[4]);addXp(20);ok();fanfare(3);toast('🏅 +'+fmt(a[4])+' ₽');render()},
pres:function(){modal('<div class="hero"><div class="em">👑</div><div class="sec">Начать заново?</div><div class="mu">Гараж и деньги сбросятся. Альбом, уровень и достижения останутся. Доход +25% навсегда.</div></div><div class="bs"><button class="btn" data-a="close">Отмена</button><button class="btn pu" data-a="pres2">Престиж</button></div>')},
pres2:function(){S.pres++;S.garage=[];S.bal=50000;S.col=Date.now();S.lots=[];S.flt='all';addXp(100);if(S.pres===1){var d=mk('secret',32);addCar(d);drop=[d]}closeM();ok();conf('#22d3ee');fanfare(5);render();if(S.pres===1)dropModal()},
sellDrop:function(){var t=0;drop.forEach(function(c){t+=val(c);rm(c.uid);S.st.sold++});gain(t);closeM();toast('Продано · +'+fmt(t)+' ₽');render()},
sell:function(v){var c=find(v);if(!c)return;var p=val(c);rm(v);gain(p);S.st.sold++;closeM();hap('medium');snd(600,.12);toast('Продано · +'+fmt(p)+' ₽');render()},
up:function(v){var c=find(v);if(!c||c.lv>=MAXLV)return;var p=upc(c);if(S.bal<p){toast('Недостаточно средств!');return}S.bal-=p;c.lv++;addXp(8);ok();fanfare(2);toast('🔧 ★'+c.lv+' · ⚡'+pw(c));render();carModal(v)},
sellC:function(){var l=S.garage.filter(function(c){return c.r==='common'}),t=0;if(!l.length){toast('Обычных машин нет');return}l.forEach(function(c){t+=val(c);rm(c.uid);S.st.sold++});gain(t);if(S.flt==='common')S.flt='all';hap('medium');toast('Продано '+l.length+' · +'+fmt(t)+' ₽');render()},
fuse:function(){var h='<div class="sec c">🧬 Слияние</div><div class="mu c" style="margin-bottom:10px">3 машины одной редкости → 1 новая. 90% — на ступень выше, 10% — на две.</div>',any=0;
R.slice(0,6).forEach(function(r){var n=S.garage.filter(function(c){return c.r===r.id}).length;if(n>=3){any=1;h+='<div class="bs" style="margin-bottom:8px"><button class="btn pu" data-a="fuseDo" data-v="'+r.id+'">3× '+r.n+' → '+R[r.i+1].n+'+<small>есть '+n+' шт</small></button></div>'}});
if(!any)h+='<div class="empty"><i>🧬</i>Нужно хотя бы 3 машины одной редкости</div>';modal(h+'<div class="bs mt"><button class="btn" data-a="close">Закрыть</button></div>')},
fuseDo:function(v){var l=S.garage.filter(function(c){return c.r===v}).sort(function(a,b){return a.lv-b.lv}).slice(0,3);if(l.length<3)return;l.forEach(function(c){rm(c.uid)});var i=RM[v].i,t=Math.min(6,i+(Math.random()<.1?2:1)),d=mk(R[t].id);addCar(d);drop=[d];addXp(15);hap('heavy');render();dropModal()},
spin:function(){if(S.spinD===today())return;S.spinD=today();var P=[[1500,'1 500 ₽'],[3000,'3 000 ₽'],[5000,'5 000 ₽'],[10000,'10 000 ₽'],[25000,'25 000 ₽'],[0,'🚗 Машина']],n=0,w=Math.random()<.5?0:Math.random()<.6?1:Math.random()<.5?2:Math.random()<.5?3:Math.random()<.5?5:4;
var iv=setInterval(function(){$('wh').textContent=P[n++%6][1];snd(300+n*15,.04,'square');if(n>20&&n%6===w){clearInterval(iv);var p=P[w];if(p[0])gain(p[0]);else{var d=mk(roll(CT[1].ch));addCar(d);drop=[d]}ok();conf('#22d3ee');fanfare(3);$('wh').textContent='🎉 '+p[1];render();setTimeout(function(){if(!p[0])dropModal();else toast('🎡 +'+p[1])},500)}},90);document.querySelector('[data-a=spin]').disabled=true},
refresh:function(){if(S.bal<500){toast('Недостаточно средств!');return}S.bal-=500;genLots();hap();render()},
buy:function(v){var c=S.lots[v];if(!c||S.bal<c.price){toast('Недостаточно средств!');return}S.bal-=c.price;S.lots.splice(v,1);delete c.price;addCar(c);ok();snd(520,.15);toast('Куплено: '+CARS[c.ci][0]);render()},
claim:function(v){var q=QS.filter(function(x){return x[0]===v})[0];qd();if(S.q[v]<q[2]||S.q.cl[v])return;S.q.cl[v]=1;gain(q[3]);addXp(15);ok();fanfare(2);toast('✅ +'+fmt(q[3])+' ₽');render()},
pick:function(v){var h='<div class="sec c">Выбери машину · '+(v==='d'?'Дуэль':LG[v].n)+'</div>';S.garage.slice().sort(function(a,b){return pw(b)-pw(a)}).slice(0,8).forEach(function(c){var r=RM[c.r];h+='<div class="lot" style="--rc:'+r.c+'"><div class="em">'+ico(c.ci)+'</div><div style="flex:1"><div class="nm">'+CARS[c.ci][0]+'</div><div class="rr">'+r.n+' · ⚡'+pw(c)+'</div></div><button class="btn gr" data-a="'+(v==='d'?'duel':'go')+'" data-v="'+(v==='d'?c.uid:v+':'+c.uid)+'">Старт</button></div>'});modal(h+'<div class="bs mt"><button class="btn" data-a="close">Отмена</button></div>')},
go:function(v){var a=v.split(':'),L=a[0]==='d'?{n:'Дуэль · '+DUEL.name,e:'⚔️',m:1,rw:2.2,xp:50}:LG[a[0]],c=find(a[1]);if(!c)return;if(fuel()<1){toast('Нет топлива ⛽');return}useFuel();
var p=pw(c),o=DUEL?DUEL.power:Math.round(p*L.m),win=DUEL?DUEL.win:Math.random()<p/(p+o),tw=rand(30,36),tl=tw+rand(3,8),tm=win?tw:tl,to=win?tl:tw,opp=ico(rand(0,NC-1));
modal('<div class="sec c">'+L.e+' '+L.n+' · ⚡'+p+' против ⚡'+o+'</div><div class="ln"><div class="cr" id="c1">'+ico(c.ci)+'</div><div class="fl">🏁</div></div><div class="ln"><div class="cr" id="c2">'+opp+'</div><div class="fl">🏁</div></div><div id="rs" class="c mt" style="min-height:90px"><div class="mu">Заезд идёт…</div></div>');
var t=0;snd(220,.4,'sawtooth');var iv=setInterval(function(){t++;var x=Math.min(100,100*Math.pow(t/tm,.92)+Math.sin(t)*1.2),y=Math.min(100,100*Math.pow(t/to,.92)+Math.cos(t*1.3)*1.2);
if(!$('c1')){clearInterval(iv);return}$('c1').style.left=Math.max(0,x)*.8+'%';$('c2').style.left=Math.max(0,y)*.8+'%';
if(t>=Math.min(tm,to)+3){clearInterval(iv);S.st.races++;var rw=Math.round((200+o*3)*L.rw),h;
if(win){S.st.wins++;S.st.ws=(S.st.ws||0)+1;S.st.mws=Math.max(S.st.mws||0,S.st.ws);qadd('w');gain(rw);addXp(L.xp);ok();fanfare(4);conf('#ff7a1a');h='<div class="sec" style="color:#3be07b;font-size:18px">🏆 Победа!</div><div class="mu">+'+fmt(rw)+' ₽ · +'+L.xp+' XP</div>'}else{S.st.ws=0;var r2=Math.round(rw*.1);gain(r2);addXp(5);snd(150,.5,'sawtooth');h='<div class="sec" style="color:#ff7a7a;font-size:18px">Проигрыш</div><div class="mu">Утешительные +'+fmt(r2)+' ₽ · +5 XP</div>'}
$('rs').innerHTML=h+'<div class="bs mt"><button class="btn" data-a="close">Закрыть</button><button class="btn gr" data-a="'+(a[0]==='d'?'duel':'go')+'" data-v="'+(a[0]==='d'?a[1]:v)+'">Ещё раз</button></div>';render()}},70)},
mute:function(){S.mute=S.mute?0:1;render()},
reset:function(){modal('<div class="hero"><div class="em">⚠️</div><div class="sec">Сбросить весь прогресс?</div><div class="mu">Машины, деньги и уровень будут удалены</div></div><div class="bs"><button class="btn" data-a="close">Отмена</button><button class="btn rd" data-a="reset2">Да, сбросить</button></div>')},
reset2:function(){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}};
document.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(!t||t.disabled)return;var f=A[t.dataset.a];if(f){if(t.classList.contains('btn'))hap();f(t.dataset.v)}});
render();if(API){sync(1);setInterval(function(){if(ready)sync(0)},30000)}
setInterval(function(){if(!$('ov')&&(S.tab==='garage'||S.tab==='race'))render()},15000);
})();
</script></body></html>
