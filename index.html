<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Гараж Легенд</title>
<script src="https://telegram.org"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#0a0a10;color:#fff;min-height:100vh}
.app{display:flex;flex-direction:column;min-height:100vh;max-width:520px;margin:0 auto}
header{padding:14px 16px;background:#12121c;border-bottom:1px solid #222}
.header-top{display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;font-weight:800;color:#ffd700}
.header-stats{display:flex;gap:8px}
.stat{background:#1a1a28;padding:4px 10px;border-radius:16px;font-size:13px;font-weight:700}
.region-bar{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
.region-chip{padding:4px 10px;font-size:11px;border-radius:12px;background:#1a1a28;color:#888;white-space:nowrap;cursor:pointer}
.region-chip.active{background:#ffd700;color:#111;font-weight:700}
main{flex:1;overflow-y:auto;padding:16px}
.garage-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.car-card{background:#14141f;border-radius:12px;padding:12px;text-align:center;border:1px solid #222}
.car-img{font-size:36px}
.car-name{font-size:12px;margin:4px 0;font-weight:700}
.car-plate{font-size:12px;font-weight:800;padding:2px 6px;border-radius:4px;display:inline-block}
.rarity-common{color:#aaa;border:1px solid #555}
.rarity-uncommon{color:#4caf50;border:1px solid #4caf50}
.rarity-rare{color:#2196f3;border:1px solid #2196f3}
.rarity-epic{color:#9c27b0;border:1px solid #9c27b0}
.rarity-legendary{color:#ff9800;border:1px solid #ff9800}
.rarity-mythic{color:#f44336;border:1px solid #f44336}
.rarity-secret{color:#ffd700;border:1px solid #ffd700}
.container-card{background:#14141f;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #222}
.container-card h3{font-size:15px;margin-bottom:4px}
.container-card p{font-size:12px;color:#888;margin-bottom:10px}
.btn{width:100%;padding:12px;font-size:14px;font-weight:700;border:none;border-radius:10px;cursor:pointer}
.btn-gold{background:linear-gradient(90deg,#ffd700,#ff8c00);color:#111}
.btn-blue{background:#2196f3;color:#fff}
.btn-red{background:#f44336;color:#fff}
.auction-card{background:#14141f;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #222}
.lot-title{font-size:14px;font-weight:700}
.lot-info{font-size:12px;color:#888;margin:4px 0}
.lot-timer{font-size:12px;color:#ff9800;font-weight:700;margin-bottom:8px}
.bid-row{display:flex;gap:8px}
.bid-row input{flex:1;padding:8px;background:#0a0a10;border:1px solid #333;border-radius:8px;color:#fff}
.profile-section{background:#14141f;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #222}
.profile-section h3{color:#ffd700;margin-bottom:8px;font-size:14px}
.profile-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid #222}
.bottom-nav{display:flex;background:#12121c;border-top:1px solid #222;padding:8px 0}
.nav-item{flex:1;text-align:center;font-size:11px;color:#666;padding:6px 2px;cursor:pointer}
.nav-item.active{color:#ffd700;font-weight:700}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a1a28;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;border:1px solid #ffd700;z-index:99}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-top">
      <h1>ГАРАЖ ЛЕГЕНД</h1>
      <div class="header-stats">
        <div class="stat">👑 <span id="prestige">0</span></div>
        <div class="stat">₽ <span id="balance">0</span></div>
      </div>
    </div>
    <div class="region-bar" id="regionBar"></div>
  </header>
 
  <main id="mainContent"></main>
 
  <nav class="bottom-nav">
    <div class="nav-item active" data-tab="garage">🚗<br>Гараж</div>
    <div class="nav-item" data-tab="containers">🎁<br>Контейнеры</div>
    <div class="nav-item" data-tab="market">🛒<br>Маркет</div>
    <div class="nav-item" data-tab="auction">🔨<br>Аукцион</div>
    <div class="nav-item" data-tab="profile">👤<br>Профиль</div>
  </nav>
</div>
 
<script>
// Безопасная инициализация Telegram SDK
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
}
 
const REGIONS = [
  {id:'ru', name:'🇷🇺 Россия'},
  {id:'kz', name:'🇰🇿 Казахстан'},
  {id:'by', name:'🇧🇾 Беларусь'},
  {id:'az', name:'🇦🇿 Азербайджан'},
  {id:'am', name:'🇦🇲 Армения'},
  {id:'ge', name:'🇬🇪 Грузия'},
  {id:'de', name:'🇩🇪 Германия'},
  {id:'ae', name:'🇦🇪 Дубай'}
];
 
const RARITIES = {
  common: {name:'Обычный', class:'rarity-common'},
  uncommon: {name:'Необычный', class:'rarity-uncommon'},
  rare: {name:'Редкий', class:'rarity-rare'},
  epic: {name:'Эпический', class:'rarity-epic'},
  legendary: {name:'Легендарный', class:'rarity-legendary'},
  mythic: {name:'Мифический', class:'rarity-mythic'},
  secret: {name:'Секретный', class:'rarity-secret'}
};
 
const CARS = [
  {name:'ВАЗ-2106', emoji:'🚗'},
  {name:'BMW M3', emoji:'🚙'},
  {name:'Mercedes AMG', emoji:'🏎️'},
  {name:'Ferrari 488', emoji:'🏁'},
  {name:'Lamborghini', emoji:'🚀'},
  {name:'Bugatti', emoji:'💎'}
];
 
const CONTAINERS = [
  {id:'basic', name:'Обычный контейнер', price:500, desc:'Шанс на редкий номер', chances:{common:50,uncommon:25,rare:15,epic:7,legendary:2,mythic:0.8,secret:0.2}},
  {id:'gold', name:'Золотой контейнер', price:2500, desc:'Повышенный шанс', chances:{common:20,uncommon:25,rare:25,epic:18,legendary:8,mythic:3,secret:1}},
  {id:'elite', name:'Элитный контейнер', price:10000, desc:'Шанс на легендарные', chances:{common:5,uncommon:10,rare:20,epic:30,legendary:20,mythic:10,secret:5}}
];
 
let state = {
  balance: 50000,
  prestige: 0,
  region: 'ru',
  activeTab: 'garage', // Храним активную вкладку прямо в состоянии
  garage: [],
  inventory: [],
  auction: [
    {id:1, title:'Ferrari 488 + А123БВ 77', seller:'Игрок_42', currentBid:15000, timer:3600},
    {id:2, title:'Секретный М777ММ 01', seller:'Легенда_99', currentBid:50000, timer:7200},
    {id:3, title:'Lamborghini + К001КК 777', seller:'Скоростной', currentBid:30000, timer:1800}
  ],
  stats: {containersOpened:0, totalEarned:0}
};
 
function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
 
function rollRarity(chances){
  let r = Math.random()*100, s = 0;
  for(let [k,v] of Object.entries(chances)){
    s += v;
    if(r <= s) return k;
  }
  return 'common';
}
 
function generatePlate(reg){
  const L = 'АВЕКМНОРСТУХ';
  const codes = {ru:'RUS',kz:'KAZ',by:'BLR',az:'AZE',am:'ARM',ge:'GEO',de:'DEU',ae:'ARE'};
  return L[rand(0,8)] + rand(100,999) + L[rand(0,8)] + L[rand(0,8)] + ' ' + (codes[reg]||'RUS');
}
 
function formatMoney(n){ return n.toLocaleString('ru-RU'); }
 
function showToast(text){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}
 
function renderRegionBar(){
  document.getElementById('regionBar').innerHTML = REGIONS.map(r =>
    `<div class="region-chip ${r.id===state.region?'active':''}" onclick="setRegion('${r.id}')">${r.name}</div>`
  ).join('');
}
 
function setRegion(id){
  state.region = id;
  renderRegionBar();
  render();
}
 
function renderHeader(){
  document.getElementById('balance').textContent = formatMoney(state.balance);
  document.getElementById('prestige').textContent = state.prestige;
}
 
function renderGarage(){
  if(state.garage.length === 0){
    return `<div class="profile-section"><h3>Гараж пуст</h3><p style="font-size:12px;color:#888;margin-top:5px;">Открой контейнер во вкладке ниже!</p></div>`;
  }
  return `<div class="garage-grid">${state.garage.map(c =>
    `<div class="car-card">
      <div class="car-img">${c.emoji}</div>
      <div class="car-name">${c.name}</div>
      <div class="car-plate ${RARITIES[c.plateRarity].class}">${c.plate}</div>
      <div style="font-size:10px;color:#666;margin-top:4px">${RARITIES[c.plateRarity].name}</div>
    </div>`
  ).join('')}</div>`;
}
 
function renderContainers(){
  return CONTAINERS.map(c =>
    `<div class="container-card">
      <h3>${c.name}</h3>
      <p>${c.desc}</p>
      <div style="font-size:13px;margin-bottom:10px">Цена: <b>${formatMoney(c.price)} ₽</b></div>
      <button class="btn btn-gold" onclick="openContainer('${c.id}')">Открыть</button>
    </div>`
  ).join('');
}
 
function renderMarket(){
  if(state.inventory.length === 0){
    return `<div class="profile-section"><h3>Инвентарь пуст</h3></div>`;
  }
  return state.inventory.map((item,i) =>
    `<div class="container-card">
      <h3>${item.emoji||''} ${item.name||item.plate}</h3>
      <button class="btn btn-blue" onclick="sellItem(${i})">Продать за ${formatMoney(item.price)} ₽</button>
    </div>`
  ).join('');
}
 
function renderAuction(){
  return state.auction.map(l =>
    `<div class="auction-card">
      <div class="lot-title">${l.title}</div>
      <div class="lot-info">Продавец: ${l.seller}</div>
      <div class="lot-timer">⏳ ${Math.floor(l.timer/60)} мин</div>
      <div style="margin-bottom:8px">Ставка: <b>${formatMoney(l.currentBid)} ₽</b></div>
      <div class="bid-row">
        <input type="number" id="bid${l.id}" min="${l.currentBid+100}" placeholder="Ставка">
        <button class="btn btn-red" onclick="placeBid(${l.id})">Ставка</button>
      </div>
    </div>`
  ).join('');
}
 
function renderProfile(){
  return `<div class="profile-section">
    <h3>Статистика</h3>
    <div class="profile-row"><span>Контейнеров</span><span>${state.stats.containersOpened}</span></div>
    <div class="profile-row"><span>Заработано</span><span>${formatMoney(state.stats.totalEarned)} ₽</span></div>
    <div class="profile-row"><span>Машин</span><span>${state.garage.length}</span></div>
  </div>`;
}
 
function render(){
  renderHeader();const main = document.getElementById('mainContent');
if(state.activeTab === 'garage') main.innerHTML = renderGarage();
else if(state.activeTab === 'containers') main.innerHTML = renderContainers();
else if(state.activeTab === 'market') main.innerHTML = renderMarket();
else if(state.activeTab === 'auction') main.innerHTML = renderAuction();
else if(state.activeTab === 'profile') main.innerHTML = renderProfile();
}
function openContainer(id){
const c = CONTAINERS.find(x => x.id === id);
if(state.balance < c.price){ showToast('Недостаточно средств!'); return; }
state.balance -= c.price;
state.stats.containersOpened++;
const rarity = rollRarity(c.chances);
const car = CARS[rand(0, CARS.length-1)];
const plate = generatePlate(state.region);
state.garage.push({...car, plate, plateRarity: rarity, region: state.region, price: rand(c.price, c.price*3)});
showToast(Выпал: ${car.name} ${plate} (${RARITIES[rarity].name})!);
render();
}
function sellItem(i){
const item = state.inventory[i];
state.balance += item.price;
state.stats.totalEarned += item.price;
state.inventory.splice(i, 1);
showToast(Продано за ${formatMoney(item.price)} ₽);
render();
}
function placeBid(id){
const lot = state.auction.find(l => l.id === id);
const bidInput = document.getElementById('bid'+id);
const bid = parseInt(bidInput.value);
if(!bid || bid <= lot.currentBid){ showToast('Ставка должна быть выше!'); return; }
if(state.balance < bid){ showToast('Недостаточно средств!'); return; }
state.balance -= bid;
lot.currentBid = bid;
bidInput.value = '';
showToast(Ставка ${formatMoney(bid)} ₽ принята!);
render();
}
// Исправленная навигация
document.querySelectorAll('.nav-item').forEach(item => {
item.addEventListener('click', () => {
document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
item.classList.add('active');
state.activeTab = item.dataset.tab; // Обновляем активный таб в состоянии
render();
});
});
// Первая инициализация приложения
renderRegionBar();
render();
setInterval(() => {
state.auction.forEach(l => { if(l.timer > 0) l.timer--; });
if(state.activeTab === 'auction') render();
}, 1000);
